name: "check-version-bump"

on:
  pull_request:
    paths:
      - "src/**"

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - uses: "actions/checkout@v4"
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false

      - uses: "actions/checkout@v4"
        with:
          path: pull-request
          fetch-depth: 0
          persist-credentials: false

      - name: Check VERSION bumped
        # Read PR files as data; never execute the PR's copy of the checker.
        working-directory: pull-request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node "$GITHUB_WORKSPACE/trusted-base/build/check-version-bump.js" "$BASE_SHA"
