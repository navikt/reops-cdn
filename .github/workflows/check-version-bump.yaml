name: "check-version-bump"

on:
  pull_request:
    paths:
      - "src/**"

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: Check VERSION bumped
        run: node build/check-version-bump.js origin/${{ github.base_ref }}
